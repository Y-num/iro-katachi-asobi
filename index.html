<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>いろと かたち あそび</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- 背景のタップできるふわふわ装飾 -->
    <div class="bg-decorations" aria-hidden="true">
      <button class="bg-toy bg-circle" type="button" tabindex="-1"></button>
      <button class="bg-toy bg-blob" type="button" tabindex="-1"></button>
      <button class="bg-toy bg-star-toy" type="button" tabindex="-1">★</button>
      <button class="bg-toy bg-heart-toy" type="button" tabindex="-1">♥</button>
      <button class="bg-toy bg-note-toy" type="button" tabindex="-1">♪</button>
    </div>

    <!-- タップエフェクト＆紙吹雪用キャンバス -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <!-- トップバー -->
    <header class="top-bar">
      <button id="btn-home" class="icon-btn hidden" type="button" aria-label="もどる">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3L12 3z" />
        </svg>
      </button>

      <div id="progress-stars" class="progress-stars hidden" aria-label="しんちょく">
        <!-- JSで5つの星を生成 -->
      </div>

      <button id="btn-sound" class="icon-btn sound-on" type="button" aria-label="おとの オン・オフ">
        <svg id="icon-sound-on" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
      </button>
    </header>

    <!-- ホーム画面 -->
    <main id="screen-home" class="screen active">
      <div class="hero-section">
        <div class="hero-badges">
          <button class="hero-dot" type="button" data-note="0" style="background: #ff595e;" aria-label="あか"></button>
          <button class="hero-dot" type="button" data-note="1" style="background: #ffca3a;" aria-label="きいろ"></button>
          <button class="hero-dot" type="button" data-note="2" style="background: #8ac926;" aria-label="みどり"></button>
          <button class="hero-dot" type="button" data-note="3" style="background: #1982c4;" aria-label="あお"></button>
        </div>
        <h1 class="app-title">いろ・かたち</h1>
      </div>

      <div class="mode-grid">
        <button class="mode-card mode-color" data-mode="color" type="button" aria-label="いろあわせ">
          <div class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 120 100" width="96" height="80">
              <circle cx="32" cy="36" r="20" fill="#FF595E" stroke="#D9383E" stroke-width="3" />
              <circle cx="62" cy="64" r="20" fill="#FFCA3A" stroke="#D9A314" stroke-width="3" />
              <circle cx="88" cy="34" r="20" fill="#1982C4" stroke="#105E91" stroke-width="3" />
            </svg>
          </div>
          <span class="mode-label">いろ</span>
        </button>

        <button class="mode-card mode-shape" data-mode="shape" type="button" aria-label="かたちあわせ">
          <div class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 120 100" width="96" height="80">
              <circle cx="28" cy="36" r="18" fill="#8AC926" stroke="#669B14" stroke-width="3" />
              <polygon points="88,16 108,52 68,52" fill="#FF924C" stroke="#D66B27" stroke-width="3" stroke-linejoin="round" />
              <rect x="42" y="56" width="34" height="34" rx="7" fill="#9B5DE5" stroke="#7538BF" stroke-width="3" />
            </svg>
          </div>
          <span class="mode-label">かたち</span>
        </button>

        <button class="mode-card mode-mix" data-mode="mix" type="button" aria-label="いろと かたち">
          <div class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 120 100" width="96" height="80">
              <path d="M36 16 L44 34 L63 36 L49 49 L53 68 L36 58 L19 68 L23 49 L9 36 L28 34 Z" fill="#FF595E" stroke="#D9383E" stroke-width="3" stroke-linejoin="round" />
              <path d="M58 50 L68 50 M63 45 L63 55" stroke="#3A2E25" stroke-width="4" stroke-linecap="round" opacity="0.5" />
              <path d="M88 32 L95 48 L112 50 L99 61 L103 78 L88 69 L73 78 L77 61 L64 50 L81 48 Z" fill="#FFCA3A" stroke="#FF924C" stroke-width="3" stroke-linejoin="round" />
            </svg>
          </div>
          <span class="mode-label">いろ＋かたち</span>
        </button>
      </div>
    </main>

    <!-- ゲーム画面 -->
    <main id="screen-game" class="screen">
      <div class="question-area">
        <div class="stage-row">
          <!-- お題見本 / ドロップターゲット（タップでジャンプ＆音声再生） -->
          <div id="target-slot" class="target-slot" role="button" tabindex="0" aria-label="おだい">
            <div id="target-visual" class="target-visual"></div>
            <button id="btn-speak" class="mini-speak-btn" type="button" aria-label="もういちど きく">🔊</button>
          </div>

          <!-- 正解すると育つ木（おひさま・くも・木をタップできるギミック付き） -->
          <div id="tree-stage" class="tree-stage" role="button" tabindex="0" aria-label="そだつ き">
            <button id="toy-sun" class="stage-toy toy-sun" type="button" aria-label="おひさま">☀️</button>
            <button id="toy-cloud" class="stage-toy toy-cloud" type="button" aria-label="くも">☁️</button>
            <div id="tree-visual" class="tree-visual"></div>
            <div id="tree-sparkle" class="tree-sparkle" aria-hidden="true">✨</div>
          </div>
        </div>
      </div>

      <!-- ビジュアルほめスタンプ -->
      <div id="feedback-bubble" class="feedback-bubble hidden" aria-hidden="true">
        <span id="feedback-emoji" class="feedback-emoji">🌟</span>
      </div>

      <!-- 選択肢カード -->
      <div id="choices-grid" class="choices-grid">
        <!-- JSでカードを生成 -->
      </div>
    </main>

    <!-- クリア（ごほうび）画面 -->
    <main id="screen-clear" class="screen">
      <div class="clear-card">
        <div class="clear-celebration">
          <button id="clear-tree-btn" class="clear-toy-btn" type="button" aria-label="きを さわる">
            <div id="clear-tree-visual" class="clear-tree-visual"></div>
          </button>
          <button id="clear-medal-btn" class="clear-toy-btn medal-wrap" type="button" aria-label="メダルを さわる">
            <svg viewBox="0 0 120 120" width="96" height="96" class="medal-svg">
              <path d="M36 72 L24 112 L46 102 L56 116 L60 76 Z" fill="#FF595E" />
              <path d="M84 72 L96 112 L74 102 L64 116 L60 76 Z" fill="#1982C4" />
              <circle cx="60" cy="48" r="36" fill="#FFCA3A" stroke="#FF924C" stroke-width="5" />
              <path d="M60 22 L67 38 L84 40 L71 51 L75 68 L60 59 L45 68 L49 51 L36 40 L53 38 Z" fill="#FFFDF5" />
            </svg>
          </button>
        </div>
        <h2 class="clear-title">🎉 できたね！ 🎉</h2>
        <div class="clear-actions">
          <button id="btn-replay" class="action-btn primary" type="button" aria-label="もういちど">🔁 もういっかい</button>
          <button id="btn-choose-mode" class="action-btn secondary" type="button" aria-label="もどる">🏠 もどる</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
