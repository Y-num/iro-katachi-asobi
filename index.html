<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>いろと かたち おにわあそび</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- 背景のタップできるふわふわ装飾 -->
    <div class="bg-decorations" aria-hidden="true">
      <button class="bg-toy bg-circle" type="button" tabindex="-1"></button>
      <button class="bg-toy bg-blob" type="button" tabindex="-1"></button>
      <button class="bg-toy bg-star-toy" type="button" tabindex="-1">★</button>
      <button class="bg-toy bg-heart-toy" type="button" tabindex="-1">♥</button>
    </div>

    <!-- タップエフェクト＆紙吹雪用キャンバス -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <!-- トップバー -->
    <header class="top-bar">
      <button id="btn-reset" class="icon-btn" type="button" aria-label="さいしょから">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
      </button>

      <div id="score-badge" class="score-badge" aria-label="せいかいかず">
        <span class="score-star" aria-hidden="true">🌟</span>
        <span id="score-count" class="score-count">0</span>
      </div>

      <button id="btn-sound" class="icon-btn sound-on" type="button" aria-label="おとの オン・オフ">
        <svg id="icon-sound-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
      </button>
    </header>

    <!-- 広いおにわワールド（上部でみんなが生活して動き回る） -->
    <section id="garden-world" class="garden-world" aria-label="おにわの せかい">
      <!-- 空のオブジェクト -->
      <button id="toy-sun" class="sky-item toy-sun" type="button" aria-label="おひさま">☀️</button>
      <button id="toy-cloud-1" class="sky-item toy-cloud-1" type="button" aria-label="くも">☁️</button>
      <button id="toy-cloud-2" class="sky-item toy-cloud-2" type="button" aria-label="くも">☁️</button>
      <button id="toy-rainbow" class="sky-item toy-rainbow hidden" type="button" aria-label="にじ">🌈</button>
      <button id="toy-balloon" class="sky-item toy-balloon hidden" type="button" aria-label="ふうせん">🎈</button>

      <!-- おにわの木（中央） -->
      <div id="tree-wrap" class="tree-wrap" role="button" tabindex="0" aria-label="き">
        <div id="tree-visual" class="tree-visual"></div>
        <div id="tree-sparkle" class="tree-sparkle" aria-hidden="true">✨</div>
      </div>

      <!-- 地面の草・お花・エサ・ざっそう・動く生き物レイヤー -->
      <div class="ground-hill" aria-hidden="true"></div>
      <div id="garden-entities" class="garden-entities">
        <!-- JSで生き物・お花・ざっそう・エサを動的に配置＆移動 -->
      </div>
    </section>

    <!-- おせわツールバー（おにわと重ならない独立バー） -->
    <div class="care-toolbar" aria-label="おせわ">
      <button id="btn-water" class="care-btn care-water" type="button" aria-label="みずやり">💧</button>
      <button id="btn-feed" class="care-btn care-feed" type="button" aria-label="えさやり">🍎</button>
      <button id="btn-weed" class="care-btn care-weed" type="button" aria-label="ざっそうとり">🌿</button>
    </div>

    <!-- パズルあそびエリア（下部） -->
    <main id="screen-game" class="game-area">
      <!-- お題枠 -->
      <div id="target-slot" class="target-slot" role="button" tabindex="0" aria-label="おだい">
        <div id="target-visual" class="target-visual"></div>
        <button id="btn-speak" class="mini-speak-btn" type="button" aria-label="もういちど きく">🔊</button>
      </div>

      <!-- 選択肢カード（2x2） -->
      <div id="choices-grid" class="choices-grid">
        <!-- JSでカードを生成 -->
      </div>

      <!-- ビジュアルほめスタンプ -->
      <div id="feedback-bubble" class="feedback-bubble hidden" aria-hidden="true">
        <span id="feedback-emoji" class="feedback-emoji">🌟</span>
      </div>
    </main>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
